name: 데이터 갱신

on:
  schedule:
    # **매시각 17분에.** 포털이 몇 시에 올리는지 문서에 없어서 하루를 통째로 덮는다.
    #
    # ⚠️ **정각(`0`)을 피한다.** 전 세계 워크플로가 정각에 몰려 **지연이 길고 누락도 잦다.**
    #
    # 낮엔 열 번쯤 헛돈다(그날 종가가 아직 세상에 없다). 그래도 **드는 게 없다** —
    # 스크립트가 **날짜만 짚어보고 이미 최신이면 그 자리에서 끝낸다**(호출 4번).
    # 공개 저장소는 Actions가 무료고, 내용이 안 바뀌면 커밋도 안 한다.
    #
    # 며칠 로그를 보면 **실제로 몇 시에 올라오는지** 알 수 있다. 그때 좁혀도 된다.
    - cron: '17 * * * *'
  # 손으로도 돌릴 수 있게 — **첫 확인은 이걸로 한다.**
  workflow_dispatch:

# 워크플로가 커밋을 밀어야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

# 앞의 실행이 안 끝났는데 또 시작하면 서로 밀어낸다.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 30초 타임아웃이 붙어 있어 멈출 일은 없지만, 만에 하나 멈추면 기본값이 **6시간**이라
    # `concurrency` 때문에 **그동안 여섯 번의 실행이 통째로 밀린다.**
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 아래 `git pull --rebase`가 **공통 조상**을 찾을 수 있어야 한다.
          # 기본값(얕은 클론)에선 조상이 없어 되감기가 깨진다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: 목록·종가 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_symbols.py

      # **바뀐 게 없으면 커밋하지 않는다.** 하루에 스물네 번 도는데 커밋은
      # **하루 한 번**만 생긴다 — 그날 종가가 처음 들어온 그 실행에서.
      - name: 바뀌었으면 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # ⚠️ 경로를 하나씩 적지 않는다 — 그중 하나가 없으면 `git add`가 죽어서
          # **매시간 빨간 X**가 뜬다. 폴더째 맡기면 있는 것만 담는다.
          git add -A docs
          git diff --cached --quiet && echo '바뀐 게 없다' && exit 0
          # 날짜는 **KST**다. UTC로 적으면 자정 넘어 도는 실행이 어제 날짜를 단다.
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 그사이 사람이 커밋했으면 밀리기가 거부된다 — 한 번 얹어보고 다시 민다.
          git push || (git pull --rebase && git push)
