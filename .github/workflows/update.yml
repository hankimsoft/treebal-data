name: 종목 목록 갱신

on:
  schedule:
    # **포털이 몇 시에 올리는지 모른다.** 그래서 저녁에 한 시간마다 짚어본다.
    # UTC 기준이다 — `8-14`는 **17:00~23:00(KST)**이다.
    #
    # 헛도는 실행이 비싸지 않다: 스크립트가 **날짜만 짚어보고 이미 최신이면
    # 그 자리에서 끝낸다**(호출 서너 번). 공개 저장소는 Actions가 무료다.
    - cron: '0 8-14 * * *'
    # 06:10(KST) — 저녁에 못 잡았거나 크론이 통째로 건너뛴 날의 보험.
    # ⚠️ 크론은 정시에 안 돈다(몇십 분 늦고, 부하가 크면 건너뛴다). 그래서 겹쳐 둔다.
    - cron: '10 21 * * *'
  # 손으로도 돌릴 수 있게 — **첫 확인은 이걸로 한다.**
  workflow_dispatch:

# 워크플로가 커밋을 밀어야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

# 앞의 실행이 안 끝났는데 또 시작하면 서로 밀어낸다.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: 목록·종가 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_symbols.py

      # **바뀐 게 없으면 커밋하지 않는다.** 저녁에 여러 번 도는데 커밋은
      # **하루 한 번**만 생긴다 — 그날 종가가 처음 들어온 그 실행에서.
      - name: 바뀌었으면 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/symbols/krx.json docs/prices/krx.json
          git diff --cached --quiet && echo '바뀐 게 없다' && exit 0
          git commit -m "목록 갱신 $(date -u +%Y-%m-%d)"
          git push
