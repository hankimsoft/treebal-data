name: 종목 목록 갱신

on:
  schedule:
    # **포털이 몇 시에 올리는지 모른다.** 그래서 종가가 나올 만한 창을 넓게 덮는다.
    # UTC 기준이다 — `8-15`는 **17:17~00:17(KST)**이다.
    #
    # ⚠️ **정각(`0`)을 피한다.** 전 세계 워크플로가 정각에 몰려서 **지연이 길고
    # 누락도 잦다.** 어중간한 분으로 두면 같은 횟수로 더 잘 돈다.
    - cron: '17 8-15 * * *'
    # 새벽 — 자정을 넘겨 올라온 날의 보험. 얻는 건 적지만 **드는 것도 없다**:
    # 그날 종가를 이미 잡았으면 **날짜만 짚고 4호출로 끝난다**(스크립트 참고).
    - cron: '17 17 * * *'
    - cron: '17 19 * * *'
    # 06:17(KST) — 마지막 보험. 크론이 통째로 건너뛴 날을 여기서 잡는다.
    - cron: '17 21 * * *'
  # 손으로도 돌릴 수 있게 — **첫 확인은 이걸로 한다.**
  workflow_dispatch:

# 워크플로가 커밋을 밀어야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

# 앞의 실행이 안 끝났는데 또 시작하면 서로 밀어낸다.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: 목록·종가 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_symbols.py

      # **바뀐 게 없으면 커밋하지 않는다.** 저녁에 여러 번 도는데 커밋은
      # **하루 한 번**만 생긴다 — 그날 종가가 처음 들어온 그 실행에서.
      - name: 바뀌었으면 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/symbols/krx.json docs/prices/krx.json
          git diff --cached --quiet && echo '바뀐 게 없다' && exit 0
          git commit -m "목록 갱신 $(date -u +%Y-%m-%d)"
          git push
