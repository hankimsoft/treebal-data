name: 야후 응답 모양 확인

# ⚠️ **`update.yml`과 일부러 갈라 뒀다.** 같이 두면 야후가 잠깐 막힌 날 워크플로가 통째로
# 실패해서 **종목 목록·종가 갱신까지 멈춘다.** 둘은 아무 상관이 없다 —
# 이건 앱이 쓰는 남의 API를 지켜보는 것뿐이고, `docs/` 아래 파일은 건드리지 않는다.

on:
  schedule:
    # **하루 한 번.** 모양만 보는 거라 자주 볼 이유가 없고, 남의 API를 시간마다
    # 두드릴 이유는 더 없다.
    #
    # 23:23 UTC = **아침 8:23 KST**. 국내(15:30)도 미국(05:00 KST)도 닫힌 뒤라
    # 응답이 가장 조용한 시간대다. 정각과 `update.yml`의 17분을 둘 다 피했다.
    - cron: '23 23 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      # ⚠️ **카나리부터 확인한다**(2026-09-08). 이 감시는 *"모양이 바뀌면 메일이 온다"*는
      # 약속 하나로 존재하는데, 그 약속이 깨져 있어도 **아무도 모른다** — 야후는 대개
      # 안 바뀌므로 늘 초록이고, 그게 *"잘 지키고 있다"*와 구분이 안 된다.
      # 실제로 **200인데 구조가 깨진 경우를 조용히 통과**시키고 있었다.
      #
      # 네트워크를 안 쓰므로(가짜 야후) 몇 초면 끝나고, 러너 상태와 무관하게 늘 같은 답이다.
      - name: 카나리가 약속을 지키는지
        run: python scripts/test_check_yahoo.py
      - name: 야후 응답 확인
        run: python scripts/check_yahoo.py
