name: 야후 응답 모양 확인

# ⚠️ **`update.yml`과 일부러 갈라 뒀다.** 같이 두면 야후가 잠깐 막힌 날 워크플로가 통째로
# 실패해서 **종목 목록·종가 갱신까지 멈춘다.** 둘은 아무 상관이 없다 —
# 이건 앱이 쓰는 남의 API를 지켜보는 것뿐이고, `docs/` 아래 파일은 건드리지 않는다.

on:
  schedule:
    # **하루 한 번.** 모양만 보는 거라 자주 볼 이유가 없고, 남의 API를 시간마다
    # 두드릴 이유는 더 없다.
    #
    # 23:23 UTC = **아침 8:23 KST**. 국내(15:30)도 미국(05:00 KST)도 닫힌 뒤라
    # 응답이 가장 조용한 시간대다. 정각과 `update.yml`의 17분을 둘 다 피했다.
    - cron: '23 23 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 야후 응답 확인
        run: python scripts/check_yahoo.py
